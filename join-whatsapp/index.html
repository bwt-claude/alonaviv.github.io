<!DOCTYPE html>
<html>
    <!-- This is a redirect specifically from the whatsapp group description to the join whatsapp group link, in order to keep whatsapp description (and link people share) looking clean -->

    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-LZRG6ZN7KF"></script>
        <script>
            try {
                window.dataLayer = window.dataLayer || [];

                function gtag() {
                    dataLayer.push(arguments);
                }

                gtag('js', new Date());

                gtag('config', 'G-LZRG6ZN7KF');

                // Redirect once, after the analytics hit has been sent (event_callback),
                // or after a short timeout if it never comes back (ad blocker, offline).
                // Do NOT add a synchronous redirect below: it fires before the async
                // gtag.js/fbevents.js have loaded and the queued hits are lost.
                var redirected = false;
                function go() {
                  if (redirected) return;
                  redirected = true;
                  document.location = "https://links.broadwaywithatwist.xyz/whatsapp?utm_campaign=whatsapp-description&utm_medium=whatsapp&utm_source=whatsapp-description";
                }
                gtag('event', 'redirect', {
                  'event_category': 'outbound',
                  'event_label': 'whatsapp-group-description-to-whatsapp',
                  'transport_type': 'beacon',
                  'event_callback': go
                });
                setTimeout(go, 1500);
            } catch (e) {
                document.location = "https://links.broadwaywithatwist.xyz/whatsapp?utm_campaign=whatsapp-description&utm_medium=whatsapp&utm_source=whatsapp-description";
            }

        </script>
    </head>

    <body>
    </body>

</html>
