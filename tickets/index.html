<!DOCTYPE html>
<html>

    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-M0Y73LPQJV"></script>
        <script>
            try {
                window.dataLayer = window.dataLayer || [];

                function gtag() {
                    dataLayer.push(arguments);
                }

                gtag('js', new Date());

                gtag('config', 'G-M0Y73LPQJV');

                // Redirect once, after the analytics hit has been sent (event_callback),
                // or after a short timeout if it never comes back (ad blocker, offline).
                // Do NOT add a synchronous redirect below: it fires before the async
                // gtag.js/fbevents.js have loaded and the queued hits are lost.
                var redirected = false;
                function go() {
                  if (redirected) return;
                  redirected = true;
                  document.location = "https://broadwaywithatwist.lineapp.co.il";
                }
                gtag('event', 'redirect', {
                  'event_category': 'outbound',
                  'event_label': 'lineapp',
                  'transport_type': 'beacon',
                  'event_callback': go
                });
                setTimeout(go, 1500);
            } catch (e) {
                document.location = "https://broadwaywithatwist.lineapp.co.il";
            }
        </script>
    </head>
